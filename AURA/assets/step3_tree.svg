<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0e171f"/>
      <stop offset="65%" stop-color="#080b0f"/>
      <stop offset="100%" stop-color="#030507"/>
    </radialGradient>
    <radialGradient id="treeGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="bloomCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1"/>
      <feGaussianBlur stdDeviation="2" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes treeBreathe {
        0%, 100% { opacity: 0.75; transform: scale(1); }
        50%      { opacity: 1; transform: scale(1.02); }
      }
      @keyframes synapsisBranchPulse {
        0%   { stroke-dashoffset: 300; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes synapsisRootPulse {
        0%   { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 300; }
      }
      @keyframes heartBeat {
        0%, 100% { r: 5; opacity: 0.85; filter: drop-shadow(0 0 6px #ffffff); }
        50%      { r: 8.5; opacity: 1; filter: drop-shadow(0 0 18px #38bdf8); }
      }
      @keyframes twinkleNode {
        0%, 100% { opacity: 0.3; transform: scale(0.7); }
        50%      { opacity: 1; transform: scale(1.3); }
      }
      .anim-tree-breathe {
        transform-origin: 250px 250px;
        animation: treeBreathe 5s ease-in-out infinite;
      }
      .anim-heart {
        animation: heartBeat 2s ease-in-out infinite;
      }
      .anim-synapse-up {
        stroke-dasharray: 20 80;
        animation: synapsisBranchPulse 3.5s linear infinite;
      }
      .anim-synapse-down {
        stroke-dasharray: 20 80;
        animation: synapsisRootPulse 3.5s linear infinite;
      }
      .node-1 { animation: twinkleNode 2.5s ease-in-out infinite; transform-origin: 250px 65px; }
      .node-2 { animation: twinkleNode 3.2s ease-in-out infinite 0.8s; transform-origin: 170px 95px; }
      .node-3 { animation: twinkleNode 2.8s ease-in-out infinite 1.5s; transform-origin: 330px 95px; }
      .node-4 { animation: twinkleNode 3.5s ease-in-out infinite 0.4s; transform-origin: 250px 435px; }
      .node-5 { animation: twinkleNode 3s ease-in-out infinite 1.2s; transform-origin: 170px 405px; }
      .node-6 { animation: twinkleNode 3.4s ease-in-out infinite 1.8s; transform-origin: 330px 405px; }
    </style>
  </defs>

  <rect width="500" height="500" fill="url(#bgGrad)"/>
  <circle cx="250" cy="250" r="140" fill="url(#treeGlow)" class="anim-tree-breathe"/>

  <!-- Symmetrical glowing tree with crown above and roots below -->
  <g stroke="#38bdf8" stroke-linecap="round" fill="none" opacity="0.4" filter="url(#bloomCyan)" stroke-width="4">
    <!-- Center Trunk Core -->
    <line x1="250" y1="210" x2="250" y2="290"/>
    <!-- Major Branches -->
    <path d="M250 210 Q230 170 190 140"/>
    <path d="M250 210 Q270 170 310 140"/>
    <path d="M250 210 Q240 160 250 110"/>
    <path d="M250 210 Q200 190 150 190"/>
    <path d="M250 210 Q300 190 350 190"/>
    <!-- Major Roots -->
    <path d="M250 290 Q230 330 190 360"/>
    <path d="M250 290 Q270 330 310 360"/>
    <path d="M250 290 Q240 340 250 390"/>
    <path d="M250 290 Q200 310 150 310"/>
    <path d="M250 290 Q300 310 350 310"/>
  </g>

  <!-- Fine Branches (Crown) in crisp white & cyan -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none" opacity="0.95" stroke-width="1.8">
    <!-- Trunk Center -->
    <line x1="250" y1="220" x2="250" y2="280" stroke-width="3.5"/>
    <circle cx="250" cy="250" r="5" fill="#ffffff" filter="url(#bloomCyan)" class="anim-heart"/>

    <!-- Primary upper crown branches -->
    <path d="M250 220 Q225 175 185 145" stroke-width="2.4"/>
    <path d="M250 220 Q275 175 315 145" stroke-width="2.4"/>
    <path d="M250 220 Q250 165 250 115" stroke-width="2.4"/>
    <path d="M250 220 Q210 195 155 195" stroke-width="2.2"/>
    <path d="M250 220 Q290 195 345 195" stroke-width="2.2"/>

    <!-- Secondary finer crown twigs -->
    <path d="M185 145 Q160 130 135 125" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M185 145 Q180 115 170 95" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M185 145 Q205 120 210 95" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M315 145 Q340 130 365 125" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M315 145 Q320 115 330 95" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M315 145 Q295 120 290 95" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M250 115 Q235 90 225 70" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M250 115 Q265 90 275 70" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M250 115 Q250 85 250 65" stroke="#ffffff" stroke-width="1.4"/>
    <path d="M155 195 Q130 180 110 175" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M155 195 Q135 210 115 220" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M345 195 Q370 180 390 175" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M345 195 Q365 210 385 220" stroke="#7dd3fc" stroke-width="1.2"/>

    <!-- Tertiary micro-filaments (delicate crown canopy) -->
    <path d="M135 125 L115 115 M170 95 L165 75 M210 95 L215 75 M365 125 L385 115 M330 95 L335 75 M290 95 L285 75" stroke="#bae6fd" stroke-width="0.8"/>
  </g>

  <!-- Fine Roots (Network below) in crisp cyan & white -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none" opacity="0.95" stroke-width="1.8">
    <path d="M250 280 Q225 325 185 355" stroke-width="2.4"/>
    <path d="M250 280 Q275 325 315 355" stroke-width="2.4"/>
    <path d="M250 280 Q250 335 250 385" stroke-width="2.4"/>
    <path d="M250 280 Q210 305 155 305" stroke-width="2.2"/>
    <path d="M250 280 Q290 305 345 305" stroke-width="2.2"/>

    <!-- Secondary finer roots -->
    <path d="M185 355 Q160 370 135 375" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M185 355 Q180 385 170 405" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M185 355 Q205 380 210 405" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M315 355 Q340 370 365 375" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M315 355 Q320 385 330 405" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M315 355 Q295 380 290 405" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M250 385 Q235 410 225 430" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M250 385 Q265 410 275 430" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M250 385 Q250 415 250 435" stroke="#ffffff" stroke-width="1.4"/>
    <path d="M155 305 Q130 320 110 325" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M155 305 Q135 290 115 280" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M345 305 Q370 320 390 325" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M345 305 Q365 290 385 280" stroke="#7dd3fc" stroke-width="1.2"/>

    <!-- Micro-root filaments -->
    <path d="M135 375 L115 385 M170 405 L165 425 M210 405 L215 425 M365 375 L385 385 M330 405 L335 425 M290 405 L285 425" stroke="#bae6fd" stroke-width="0.8"/>
  </g>

  <!-- Luminous Bioluminescent Synaptic Pulse Strands (Crown Branches) -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none" opacity="0.9" stroke-width="3" filter="url(#bloomCyan)">
    <path d="M250 220 Q225 175 185 145" class="anim-synapse-up"/>
    <path d="M250 220 Q275 175 315 145" class="anim-synapse-up"/>
    <path d="M250 220 Q250 165 250 115" class="anim-synapse-up"/>
    <path d="M250 220 Q210 195 155 195" class="anim-synapse-up"/>
    <path d="M250 220 Q290 195 345 195" class="anim-synapse-up"/>
  </g>

  <!-- Luminous Bioluminescent Synaptic Pulse Strands (Roots) -->
  <g stroke="#38bdf8" stroke-linecap="round" fill="none" opacity="0.9" stroke-width="3" filter="url(#bloomCyan)">
    <path d="M250 280 Q225 325 185 355" class="anim-synapse-down"/>
    <path d="M250 280 Q275 325 315 355" class="anim-synapse-down"/>
    <path d="M250 280 Q250 335 250 385" class="anim-synapse-down"/>
    <path d="M250 280 Q210 305 155 305" class="anim-synapse-down"/>
    <path d="M250 280 Q290 305 345 305" class="anim-synapse-down"/>
  </g>

  <!-- Twinkling Synaptic Terminal Nodes -->
  <circle cx="250" cy="65" r="3" fill="#ffffff" filter="url(#bloomCyan)" class="node-1"/>
  <circle cx="170" cy="95" r="2.5" fill="#38bdf8" class="node-2"/>
  <circle cx="330" cy="95" r="2.5" fill="#38bdf8" class="node-3"/>
  <circle cx="250" cy="435" r="3" fill="#ffffff" filter="url(#bloomCyan)" class="node-4"/>
  <circle cx="170" cy="405" r="2.5" fill="#38bdf8" class="node-5"/>
  <circle cx="330" cy="405" r="2.5" fill="#38bdf8" class="node-6"/>
</svg>
