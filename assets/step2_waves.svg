<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#14111d"/>
      <stop offset="65%" stop-color="#08080c"/>
      <stop offset="100%" stop-color="#040406"/>
    </radialGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="40%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="80%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <filter id="waveGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="axisGlow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

    <style>
      @keyframes waveBreathe {
        0%, 100% { transform: scaleY(1); }
        50%      { transform: scaleY(1.18); }
      }
      @keyframes waveFlowPurple {
        0%   { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes waveFlowGold {
        0%   { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }
      @keyframes rippleExpand {
        0%   { r: 4; opacity: 0.9; }
        100% { r: 55; opacity: 0; }
      }
      @keyframes pulseCenter {
        0%, 100% { r: 4; opacity: 0.85; filter: drop-shadow(0 0 6px #ffffff); }
        50%      { r: 7; opacity: 1; filter: drop-shadow(0 0 16px #c084fc); }
      }
      @keyframes axisPulse {
        0%, 100% { opacity: 0.5; }
        50%      { opacity: 0.95; }
      }
      .anim-wave-group {
        transform-origin: 250px 250px;
        animation: waveBreathe 4s ease-in-out infinite;
      }
      .anim-flow-purple {
        stroke-dasharray: 18 12;
        animation: waveFlowPurple 5s linear infinite;
      }
      .anim-flow-gold {
        stroke-dasharray: 14 10;
        animation: waveFlowGold 6s linear infinite;
      }
      .anim-pulse-center {
        animation: pulseCenter 2.2s ease-in-out infinite;
      }
      .ripple-1 {
        animation: rippleExpand 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) infinite;
      }
      .ripple-2 {
        animation: rippleExpand 2.8s cubic-bezier(0.2, 0.8, 0.4, 1) infinite 1.4s;
      }
      .anim-axis {
        animation: axisPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <rect width="500" height="500" fill="url(#bgGrad)"/>

  <!-- Vertical Purple Axis Line -->
  <line x1="250" y1="80" x2="250" y2="420" stroke="#a855f7" stroke-width="2.5" opacity="0.3" filter="url(#axisGlow)" class="anim-axis"/>
  <line x1="250" y1="80" x2="250" y2="420" stroke="#c084fc" stroke-width="1.2" opacity="0.8"/>
  
  <!-- Expanding Resonance Ripples from Center Node -->
  <circle cx="250" cy="250" r="4" stroke="#c084fc" stroke-width="1.5" fill="none" class="ripple-1"/>
  <circle cx="250" cy="250" r="4" stroke="#f59e0b" stroke-width="1.2" fill="none" class="ripple-2"/>
  
  <!-- Central Spark Node -->
  <circle cx="250" cy="250" r="4" fill="#ffffff" filter="url(#waveGlow)" class="anim-pulse-center"/>

  <!-- Harmonic Expanding Frequency Waves (Animated Oscillation Group) -->
  <g class="anim-wave-group">
    <!-- Subtle background ambient waves -->
    <path d="M 60 250 Q 80 238, 100 250 T 140 250 T 180 250 T 230 250 Q 280 180, 340 250 T 450 250" stroke="#a855f7" stroke-width="1.2" fill="none" opacity="0.25"/>
    <path d="M 60 250 Q 80 262, 100 250 T 140 250 T 180 250 T 230 250 Q 280 320, 340 250 T 450 250" stroke="#f59e0b" stroke-width="1.2" fill="none" opacity="0.25"/>

    <!-- Primary Purple Wave Envelope -->
    <path d="M 60 250 
             C 90 235, 110 265, 140 250 
             C 170 225, 195 275, 230 250 
             C 265 200, 290 310, 330 230 
             C 365 140, 400 370, 445 220" 
          stroke="url(#purpleGrad)" stroke-width="5" fill="none" opacity="0.4" filter="url(#waveGlow)"/>
    <path d="M 60 250 
             C 90 235, 110 265, 140 250 
             C 170 225, 195 275, 230 250 
             C 265 200, 290 310, 330 230 
             C 365 140, 400 370, 445 220" 
          stroke="url(#purpleGrad)" stroke-width="2.4" fill="none" opacity="0.95"/>
    
    <!-- Flowing Electric Sparkles on Purple Wave -->
    <path d="M 60 250 
             C 90 235, 110 265, 140 250 
             C 170 225, 195 275, 230 250 
             C 265 200, 290 310, 330 230 
             C 365 140, 400 370, 445 220" 
          stroke="#ffffff" stroke-width="2.6" fill="none" opacity="0.9" class="anim-flow-purple"/>

    <!-- Secondary Gold Wave Envelope -->
    <path d="M 60 250 
             C 85 260, 115 240, 145 250 
             C 175 270, 200 230, 235 250 
             C 270 290, 295 190, 335 270 
             C 370 360, 405 130, 450 280" 
          stroke="url(#goldGrad)" stroke-width="4.5" fill="none" opacity="0.4" filter="url(#waveGlow)"/>
    <path d="M 60 250 
             C 85 260, 115 240, 145 250 
             C 175 270, 200 230, 235 250 
             C 270 290, 295 190, 335 270 
             C 370 360, 405 130, 450 280" 
          stroke="url(#goldGrad)" stroke-width="2.2" fill="none" opacity="0.9"/>
    
    <!-- Flowing Gold Particle Strand -->
    <path d="M 60 250 
             C 85 260, 115 240, 145 250 
             C 175 270, 200 230, 235 250 
             C 270 290, 295 190, 335 270 
             C 370 360, 405 130, 450 280" 
          stroke="#fef08a" stroke-width="2.2" fill="none" opacity="0.85" class="anim-flow-gold"/>

    <!-- Echo / Resonance Strands -->
    <path d="M 80 250 C 130 240, 180 260, 230 250 C 275 220, 310 290, 350 220 C 390 140, 420 330, 455 240" stroke="#c084fc" stroke-width="1.2" fill="none" opacity="0.7"/>
    <path d="M 80 250 C 130 260, 180 240, 230 250 C 275 280, 310 210, 350 280 C 390 360, 420 170, 455 260" stroke="#fcd34d" stroke-width="1.2" fill="none" opacity="0.7"/>
    <path d="M 120 250 C 170 235, 210 265, 250 250 C 290 210, 330 300, 370 210 C 400 130, 430 310, 460 230" stroke="#e879f9" stroke-width="0.8" fill="none" opacity="0.5"/>
  </g>
</svg>
