<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A.U.R.A - Acceso a la Plataforma</title>
    <meta name="description" content="Accede a A.U.R.A, método de expansión somática, respiración y regulación nerviosa.">
    
    <!-- iOS Web Clip & PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="A.U.R.A">
    <meta name="theme-color" content="#050507">
    
    <!-- Icons (iOS Safari & Android PWA) -->
    <link rel="apple-touch-icon" sizes="180x180" href="assets/aura_logo_3d.png">
    <link rel="apple-touch-icon" href="assets/aura_logo_3d.png">
    <link rel="icon" type="image/png" href="assets/aura_logo_3d.png">
    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep:      #050507;
            --bg-card:      rgba(14, 16, 23, 0.88);
            --aura-gold:    #f59e0b;
            --aura-gold-light: #fbbf24;
            --aura-gold-glow: rgba(245, 158, 11, 0.3);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --font-heading: 'Outfit', sans-serif;
            --font-body:    'Inter', sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-deep);
            color: #ffffff;
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        /* Ambient subtle aura waves */
        body::before {
            content: "";
            position: fixed;
            top: 20%;
            left: 20%;
            width: 50vw;
            height: 50vh;
            background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, rgba(168, 85, 247, 0.05) 50%, transparent 70%);
            filter: blur(80px);
            pointer-events: none;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 44px 38px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        .login-logo {
            display: block;
            width: 80px;
            height: 80px;
            margin: 0 auto 12px auto;
            object-fit: contain;
            filter: drop-shadow(0 0 16px rgba(16, 185, 129, 0.5)) drop-shadow(0 0 25px rgba(245, 158, 11, 0.35));
            animation: logoFloat 4s ease-in-out infinite alternate;
        }

        @keyframes logoFloat {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-4px) scale(1.03); }
        }

        .login-title {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 8px;
            text-transform: uppercase;
            display: block;
            width: 100%;
            text-align: center;
            margin: 0 auto;
            background: linear-gradient(
                110deg,
                #ffffff 15%,
                #fef08a 35%,
                #ffffff 45%,
                #f59e0b 55%,
                #ffffff 65%,
                #ffffff 85%
            );
            background-size: 220% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: auraGleam 4s ease-in-out infinite;
            filter: drop-shadow(0 0 12px rgba(245, 158, 11, 0.4));
            position: relative;
        }

        @keyframes auraGleam {
            0%, 20% {
                background-position: 150% 0;
                filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.3));
                transform: scale(1);
            }
            45% {
                filter: drop-shadow(0 0 22px rgba(245, 158, 11, 0.95)) drop-shadow(0 0 38px rgba(251, 191, 36, 0.6));
                transform: scale(1.03);
            }
            70%, 100% {
                background-position: -150% 0;
                filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.3));
                transform: scale(1);
            }
        }

        .login-sub {
            font-size: 0.75rem;
            letter-spacing: 2.5px;
            color: var(--aura-gold-light);
            text-transform: uppercase;
            margin-top: 8px;
            margin-bottom: 32px;
            font-weight: 600;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            pointer-events: none;
            z-index: 2;
        }

        .input-wrapper .toggle-password {
            position: absolute;
            right: 16px !important;
            left: auto !important;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            cursor: pointer;
            z-index: 5;
            padding: 4px;
            font-size: 0.95rem;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .input-wrapper .toggle-password:hover {
            color: var(--aura-gold);
            transform: translateY(-50%) scale(1.1);
        }

        .form-control {
            width: 100%;
            background: #090a0f;
            border: 1px solid var(--border-subtle);
            border-radius: 12px;
            padding: 13px 46px 13px 44px;
            color: #ffffff;
            font-family: var(--font-body);
            font-size: 0.92rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--aura-gold);
            box-shadow: 0 0 14px var(--aura-gold-glow);
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #050507;
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            margin-top: 14px;
            margin-bottom: 4px;
            transition: all 0.25s ease;
            box-shadow: 0 0 18px var(--aura-gold-glow);
            text-transform: uppercase;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 26px rgba(245, 158, 11, 0.5);
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
        }

        .btn-register {
            width: 100%;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.45);
            color: var(--aura-gold-light);
            font-family: var(--font-heading);
            font-size: 0.88rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            padding: 13px 18px;
            border-radius: 12px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            text-transform: uppercase;
            transition: all 0.25s ease;
            box-shadow: 0 0 16px rgba(245, 158, 11, 0.15);
            cursor: pointer;
        }

        .btn-register:hover {
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.25), rgba(217, 119, 6, 0.3));
            border-color: var(--aura-gold);
            color: #ffffff;
            box-shadow: 0 0 24px rgba(245, 158, 11, 0.4);
            transform: translateY(-2px);
        }

        .link-sales-page {
            color: var(--aura-gold-light);
            text-decoration: none;
            font-size: 0.84rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
            padding: 4px 0;
        }

        .link-sales-page:hover {
            color: #ffffff;
            text-shadow: 0 0 12px rgba(251, 191, 36, 0.6);
        }

        .login-footer-text {
            margin-top: 28px;
            margin-bottom: 0;
            font-size: 0.74rem;
            color: #64748b;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-weight: 500;
            line-height: 1.5;
        }

        .error-msg {
            display: none;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.82rem;
            margin-bottom: 20px;
            text-align: left;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 480px) {
            body {
                padding: 16px;
                padding-top: env(safe-area-inset-top, 16px);
                padding-bottom: env(safe-area-inset-bottom, 16px);
            }
            .login-card {
                padding: 32px 22px;
                border-radius: 20px;
            }
            .login-title {
                font-size: 1.85rem;
                letter-spacing: 6px;
            }
            .login-logo {
                width: 70px;
                height: 70px;
            }
            .form-control {
                font-size: 16px !important; /* Evita que Safari en iOS haga auto-zoom */
            }
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="assets/aura_logo_3d.png" alt="A.U.R.A" class="login-logo">
        <h1 class="login-title">A.U.R.A</h1>
        <p class="login-sub">MÉTODO DE EXPANSIÓN & REGULACIÓN</p>

        <!-- Mensaje de Error en Tiempo Real -->
        <div id="error-msg" class="error-msg"></div>

        <form id="login-form" onsubmit="handleLogin(event);">
            <div class="form-group">
                <label class="form-label">Correo Electrónico</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input id="login-email" type="email" class="form-control" placeholder="tu@email.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Contraseña</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input id="login-password" type="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    <i id="togglePassword" class="fas fa-eye toggle-password" title="Mostrar/Ocultar contraseña"></i>
                </div>
            </div>

            <button type="submit" id="btn-submit-login" class="btn-submit">
                <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i> Acceder
            </button>
        </form>

        <div style="margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border-subtle); display: flex; flex-direction: column; gap: 12px;">
            <a href="https://evolucionaconaura.netlify.app/" class="link-sales-page">
                <i class="fas fa-sparkles"></i> ¿Aún no eres alumno? Conoce el Método A.U.R.A &rarr;
            </a>
            <a href="https://pay.hotmart.com/E107951365J" class="btn-register" title="Inscribirse y pagar el acceso al Método A.U.R.A">
                <i class="fas fa-bolt"></i> Registrarme en AURA
            </a>
        </div>

        <p class="login-footer-text">
            A.U.R.A &bull; Conexión Somática & Neuro-Regulación
        </p>
    </div>

    <script src="js/auth.js?v=7.0"></script>
</body>
</html>
