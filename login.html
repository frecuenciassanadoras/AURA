<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>A.U.R.A &bull; Acceso Alumnos</title>
    <meta name="description" content="Acceso a la plataforma web oficial de A.U.R.A — Neuro-regulación somática y biohacking neurosónico.">
    
    <!-- iOS Web Clip & PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="A.U.R.A">
    <meta name="theme-color" content="#000000">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">

    <!-- Fonts: Inter (PPNeueMontreal substitute) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* ==========================================================================
           DALA DESIGN SYSTEM TOKENS (Pure Void Black, Monolithic Typography & Electric Iris)
           ========================================================================== */
        :root {
            --color-void: #000000;
            --color-bone-white: #ffffff;
            --color-ash-gray: #9a9a9a;
            --color-silver-mist: #bdbdbd;
            --color-electric-iris: #8052ff;
            --color-saffron-spark: #ffb829;
            --color-deep-verdant: #15846e;
            --font-main: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        html {
            background-color: var(--color-void);
            color: var(--color-bone-white);
            font-family: var(--font-main);
            min-height: 100vh;
        }

        body {
            background-color: #000000;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 18px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient subtle aura nebula glow */
        .ambient-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(
                circle,
                rgba(128, 82, 255, 0.08) 0%,
                rgba(21, 132, 110, 0.04) 40%,
                transparent 70%
            );
            filter: blur(90px);
            pointer-events: none;
            z-index: 0;
        }

        /* Monolithic Glassmorphic Login Card */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: rgba(14, 14, 18, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.09);
            border-radius: 28px;
            padding: 48px 36px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.85), 0 0 40px rgba(128, 82, 255, 0.06);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Brand Logo (Matching Sales Page) */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 34px;
        }

        .brand-triangle-logo {
            width: 38px;
            height: 38px;
            display: block;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 16px rgba(128, 82, 255, 0.45));
            transition: transform 0.3s ease;
        }

        .brand-triangle-logo:hover {
            transform: scale(1.06);
        }

        .brand-title {
            font-size: 28px;
            font-weight: 700;
            color: var(--color-bone-white);
            letter-spacing: 0.06em;
            text-transform: uppercase;
            line-height: 1;
            margin-bottom: 8px;
        }

        .brand-sub {
            font-size: 12px;
            font-weight: 600;
            color: var(--color-saffron-spark);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        /* Form Controls */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--color-ash-gray);
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 14px;
            pointer-events: none;
            z-index: 2;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--color-ash-gray);
            cursor: pointer;
            z-index: 5;
            padding: 4px;
            font-size: 14px;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--color-electric-iris);
            transform: translateY(-50%) scale(1.1);
        }

        .form-control {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 14px 44px 14px 44px;
            color: var(--color-bone-white);
            font-family: var(--font-main);
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
        }

        .form-control::placeholder {
            color: #52525b;
        }

        .form-control:focus {
            border-color: var(--color-electric-iris);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 20px rgba(128, 82, 255, 0.25);
        }

        /* Primary Submit Button: Electric Iris Pill */
        .btn-submit {
            width: 100%;
            background-color: var(--color-electric-iris);
            color: var(--color-bone-white);
            border-radius: 22.5px;
            padding: 15px 24px;
            font-family: var(--font-main);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.025em;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 24px rgba(128, 82, 255, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-submit:hover {
            opacity: 0.92;
            transform: translateY(-1px);
            box-shadow: 0 0 32px rgba(128, 82, 255, 0.45);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Error Message Box */
        .error-msg {
            display: none;
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.35);
            color: #fda4af;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
            align-items: center;
            gap: 10px;
            line-height: 1.4;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer & Extra Actions */
        .login-footer-actions {
            margin-top: 26px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-sales-page {
            color: var(--color-silver-mist);
            text-decoration: none;
            font-size: 13px;
            font-weight: 400;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: color 0.2s ease;
        }

        .link-sales-page:hover {
            color: var(--color-bone-white);
        }

        .btn-register-ghost {
            color: var(--color-saffron-spark);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.025em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 10px 16px;
            border-radius: 20px;
            background: rgba(255, 184, 41, 0.06);
            border: 1px solid rgba(255, 184, 41, 0.22);
            transition: all 0.2s ease;
        }

        .btn-register-ghost:hover {
            background: rgba(255, 184, 41, 0.12);
            border-color: var(--color-saffron-spark);
            box-shadow: 0 0 16px rgba(255, 184, 41, 0.2);
        }

        .login-caption {
            margin-top: 24px;
            font-size: 12px;
            font-weight: 200;
            color: #52525b;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        /* Mobile Adjustments */
        @media (max-width: 480px) {
            body {
                padding: 16px;
            }
            .login-card {
                padding: 36px 24px;
                border-radius: 22px;
            }
            .brand-title {
                font-size: 25px;
            }
            .brand-triangle-logo {
                width: 32px;
                height: 32px;
            }
            .form-control {
                font-size: 16px !important; /* Evita zoom automático en Safari iOS */
                padding: 13px 40px 13px 40px;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Subtle Glow Background -->
    <div class="ambient-glow"></div>

    <!-- Login Card -->
    <div class="login-card">
        
        <!-- Brand Header with Same Gradient Triangle Logo as Sales Page -->
        <div class="brand-header">
            <svg class="brand-triangle-logo" viewBox="0 0 24 24" fill="none">
                <polygon points="12,2 22,20 2,20" fill="url(#brandGradLogin)" />
                <defs>
                    <linearGradient id="brandGradLogin" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#8052ff" />
                        <stop offset="100%" stop-color="#15846e" />
                    </linearGradient>
                </defs>
            </svg>
            <h1 class="brand-title">A.U.R.A</h1>
            <span class="brand-sub">Biohacking Neurosónico &bull; Acceso Alumnos</span>
        </div>

        <!-- Real-Time Error Message Container -->
        <div id="error-msg" class="error-msg"></div>

        <!-- Formulario de Autenticación -->
        <form id="login-form" onsubmit="handleLogin(event);">
            <div class="form-group">
                <label class="form-label" for="login-email">Correo Electrónico</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope input-icon"></i>
                    <input id="login-email" type="email" class="form-control" placeholder="tu@email.com" required autocomplete="email">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="login-password">Contraseña</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input id="login-password" type="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    <i id="togglePassword" class="fas fa-eye toggle-password" title="Mostrar/Ocultar contraseña"></i>
                </div>
            </div>

            <button type="submit" id="btn-submit-login" class="btn-submit">
                <i class="fas fa-sign-in-alt"></i> Acceder a la Plataforma
            </button>
        </form>

        <!-- Enlaces Secundarios -->
        <div class="login-footer-actions">
            <a href="index.html" class="link-sales-page">
                <i class="fas fa-arrow-left" style="font-size: 11px;"></i> Volver a la página oficial
            </a>
            <a href="https://pay.hotmart.com/E107951365J" class="btn-register-ghost" title="Inscribirse y pagar el acceso a A.U.R.A">
                <i class="fas fa-sparkles"></i> Inscribirme &bull; $25 USD
            </a>
        </div>

        <p class="login-caption">
            &copy; 2026 A.U.R.A &bull; Regulación Neurosónica
        </p>
    </div>

    <!-- Script de autenticación contra Supabase -->
    <script src="js/auth.js?v=7.0"></script>
</body>
</html>
