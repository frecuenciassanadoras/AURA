<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>A.U.R.A &bull; Taller</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <script>
        // Router automático del Taller:
        // Si el alumno tiene sesión activa va a plataforma.html, si no va a login.html
        (function() {
            var session = localStorage.getItem('aura_session') || localStorage.getItem('neurohub_session_v2');
            var loggedOut = sessionStorage.getItem('aura_logged_out') === '1';
            if (session && !loggedOut) {
                window.location.replace('plataforma.html');
            } else {
                window.location.replace('login.html');
            }
        })();
    </script>
</head>
<body style="background-color: #000000; color: #9a9a9a; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
    <p style="font-size: 14px; letter-spacing: 0.05em;">Cargando A.U.R.A...</p>
</body>
</html>
